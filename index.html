<!DOCTYPE html>
<html lang="ru">
<head>
	<meta charset="utf-8" />
	<title>Тёмная жила</title>
	<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
	<meta name="theme-color" content="#0b0d14" />
	<meta name="color-scheme" content="dark" />
	<meta name="description" content="Пошаговый extraction-рогалик про раскопки. Telegram Mini App." />
	<link rel="icon" type="image/png" href="game/index.icon.png" />
	<!-- Локальная копия официального SDK. В мобильных сетях запрос к
	     telegram.org может висеть десятки секунд, а до WebApp.ready()
	     Telegram показывает пустой экран и свою синюю полосу. -->
	<script src="telegram-web-app.js"></script>
	<script>
		try {
			if (window.Telegram && Telegram.WebApp) {
				Telegram.WebApp.ready();
				Telegram.WebApp.expand();
				// Оболочка и игра — один origin; игра читает строку из
				// sessionStorage. initData не попадает ни в URL, ни в логи.
				// ?tgdebug=1 оставляет тестовую строку для локальной проверки.
				if (Telegram.WebApp.initData) {
					sessionStorage.setItem("darklode_init_data", Telegram.WebApp.initData);
				} else if (!/[?&]tgdebug=1(?:&|$)/.test(location.search)) {
					sessionStorage.removeItem("darklode_init_data");
				}
			} else if (!/[?&]tgdebug=1(?:&|$)/.test(location.search)) {
				sessionStorage.removeItem("darklode_init_data");
			}
		} catch (error) {
			/* страница откроется и без Telegram */
		}
	</script>
	<link rel="stylesheet" href="styles.css" />
</head>
<body>
	<main id="stage">
		<div id="frame">
			<iframe
				id="game"
				src="game/index.html?v=20261030-013532"
				title="Тёмная жила"
				allow="autoplay; fullscreen; gamepad; clipboard-write"
				scrolling="no"
				tabindex="0"></iframe>
			<div id="boot" class="boot" aria-live="polite">
				<!-- Картина загрузки (Qwen): штольня, жила и лампа. Живёт в
				     web/boot.webp; слои ниже — только свет и воздух поверх неё. -->
				<div class="boot-art" aria-hidden="true"></div>
				<div class="boot-warm" aria-hidden="true"></div>
				<div class="boot-vein-glow" aria-hidden="true"></div>
				<div class="boot-fog" aria-hidden="true"></div>
				<div class="boot-dust" aria-hidden="true"></div>

				<header class="boot-brand">
					<p class="boot-eyebrow">DARK LODE</p>
					<h1 class="boot-title">Тёмная жила</h1>
					<p class="boot-sub">Пошаговый рогалик про раскопки</p>
				</header>

				<footer class="boot-foot">
					<div class="boot-track" id="boot-bar">
						<div class="boot-rail" aria-hidden="true"></div>
						<div class="boot-fill" id="boot-fill"></div>
						<div class="boot-miner" id="boot-miner" aria-hidden="true"></div>
					</div>
					<p class="boot-progress" id="boot-progress">Загрузка…</p>
				</footer>

				<div class="boot-flash" id="boot-flash" aria-hidden="true"></div>
			</div>
		</div>
	</main>
	<script src="telegram.js" defer></script>
</body>
</html>
